name: Build APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Siapkan proyek Android
        run: |
          set -e
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          A=app/src/main
          mkdir -p $A/assets $A/java/com/qrkalimat/app $A/res/drawable $A/res/drawable-nodpi $A/res/mipmap-anydpi-v26
          cp index.html $A/assets/index.html
          curl -fsSL "https://github.com/google/fonts/raw/main/ofl/nunito/Nunito%5Bwght%5D.ttf" -o $A/assets/Nunito.ttf || echo "Font gagal diunduh, pakai font bawaan"

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "QRKalimat"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.qrkalimat.app'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.qrkalimat.app'
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > $A/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="QR Kalimat"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden|uiMode"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > $A/java/com/qrkalimat/app/MainActivity.java <<'EOF'
          package com.qrkalimat.app;

          import android.app.Activity;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.view.View;
          import android.view.WindowManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.content.Intent;
          import android.net.Uri;
          import java.io.ByteArrayOutputStream;
          import java.io.InputStream;
          import java.io.OutputStream;
          import org.json.JSONObject;

          public class MainActivity extends Activity {
              WebView web;
              String pending = "";

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  web = new WebView(this);
                  web.setBackgroundColor(Color.BLACK);
                  setContentView(web);
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setAllowFileAccessFromFileURLs(true);
                  s.setTextZoom(100);
                  web.addJavascriptInterface(new Bridge(), "Android");
                  web.setWebViewClient(new WebViewClient());
                  web.setWebChromeClient(new WebChromeClient());
                  web.loadUrl("file:///android_asset/index.html");
              }

              class Bridge {
              @JavascriptInterface
              public void exportData(final String json) {
                  pending = json;
                  runOnUiThread(() -> {
                      Intent i = new Intent(Intent.ACTION_CREATE_DOCUMENT);
                      i.addCategory(Intent.CATEGORY_OPENABLE);
                      i.setType("application/json");
                      i.putExtra(Intent.EXTRA_TITLE, "qr-kalimat-backup.json");
                      startActivityForResult(i, 1);
                  });
              }

              @JavascriptInterface
              public void importData() {
                  runOnUiThread(() -> {
                      Intent i = new Intent(Intent.ACTION_OPEN_DOCUMENT);
                      i.addCategory(Intent.CATEGORY_OPENABLE);
                      i.setType("*/*");
                      startActivityForResult(i, 2);
                  });
              }

                  @JavascriptInterface
                  public void bright(final boolean on) {
                      runOnUiThread(() -> {
                          WindowManager.LayoutParams lp = getWindow().getAttributes();
                          lp.screenBrightness = on ? 1f : WindowManager.LayoutParams.BRIGHTNESS_OVERRIDE_NONE;
                          getWindow().setAttributes(lp);
                          if (on) getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                          else getWindow().clearFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                      });
                  }

                  @JavascriptInterface
                  public void theme(final boolean dark) {
                      runOnUiThread(() -> {
                          int bg = dark ? Color.BLACK : Color.parseColor("#F4F7F8");
                          getWindow().setStatusBarColor(bg);
                          getWindow().setNavigationBarColor(bg);
                          web.setBackgroundColor(bg);
                          getWindow().getDecorView().setSystemUiVisibility(dark ? 0 :
                              (View.SYSTEM_UI_FLAG_LIGHT_STATUS_BAR | View.SYSTEM_UI_FLAG_LIGHT_NAVIGATION_BAR));
                      });
                  }
              }

              @Override
              protected void onActivityResult(int rq, int rs, Intent d) {
                  super.onActivityResult(rq, rs, d);
                  if (rs != RESULT_OK || d == null || d.getData() == null) return;
                  Uri u = d.getData();
                  try {
                      if (rq == 1) {
                          OutputStream o = getContentResolver().openOutputStream(u);
                          o.write(pending.getBytes("UTF-8"));
                          o.close();
                          web.evaluateJavascript("window.onDone&&window.onDone('Data tersimpan')", null);
                      } else if (rq == 2) {
                          InputStream in = getContentResolver().openInputStream(u);
                          ByteArrayOutputStream b = new ByteArrayOutputStream();
                          byte[] buf = new byte[8192];
                          int n;
                          while ((n = in.read(buf)) > 0) b.write(buf, 0, n);
                          in.close();
                          web.evaluateJavascript("window.onImport&&window.onImport(" + JSONObject.quote(b.toString("UTF-8")) + ")", null);
                      }
                  } catch (Exception e) {
                      web.evaluateJavascript("window.onDone&&window.onDone('Gagal memproses file')", null);
                  }
              }

              @Override
              public void onBackPressed() {
                  web.evaluateJavascript("window.onBack?window.onBack():false", v -> {
                      if (!"true".equals(v)) finish();
                  });
              }
          }
          EOF

          cat > $A/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_bg"/>
              <foreground android:drawable="@drawable/ic_fg"/>
          </adaptive-icon>
          EOF

          command -v convert >/dev/null || command -v magick >/dev/null || sudo apt-get install -y imagemagick
          IM=$(command -v magick || command -v convert)
          $IM icon.png -alpha set -fuzz 8% -fill none -draw 'color 3,3 floodfill' -trim +repage -resize 288x288 -background none -gravity center -extent 432x432 $A/res/drawable-nodpi/ic_fg.png

          cat > $A/res/drawable/ic_bg.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <gradient android:angle="270" android:startColor="#0A68FD" android:endColor="#004DF5"/>
          </shape>
          EOF

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: QR-Kalimat-APK
          path: app/build/outputs/apk/debug/app-debug.apk
